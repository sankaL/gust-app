[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gust-backend"
version = "0.1.0"
description = "FastAPI backend foundation for Gust"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.18.5",
  "fastapi>=0.139.0",
  "httpx>=0.28.1",
  "langchain>=1.3.13",
  "langchain-openai>=1.3.5",
  "langchain-core>=1.4.9",
  "PyJWT[crypto]>=2.12.1",
  "pydantic-settings>=2.14.2",
  "pydantic>=2.12.5",
  "python-multipart>=0.0.32",
  "psycopg[binary]>=3.3.4",
  "sqlalchemy>=2.0.48",
  "tzdata>=2026.1",
  "uvicorn>=0.51.0"
]

[project.optional-dependencies]
ab-testing = [
  "pyyaml>=6.0.0"
]
dev = [
  "pytest>=9.0.3",
  "pytest-asyncio>=1.4.0",
  "ruff>=0.15.7"
]

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
# Keep automated modernization aligned with the only supported runtime above.
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "C90", "SIM"]

[dependency-groups]
dev = [
    # Starlette's TestClient imports httpx2 first and warns on its legacy httpx fallback.
    "httpx2>=2.7.0",
]

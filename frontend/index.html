<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#ecf1ed" />
    <script>
      // Mirrors src/lib/theme.ts (key gust_theme, dark theme-color): apply the saved theme before
      // first paint so dark-mode users do not see a light flash while the app loads.
      (function () {
        try {
          var preference = window.localStorage.getItem('gust_theme')
          var dark = preference === 'dark' || (preference === 'system' && typeof window.matchMedia === 'function' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.dataset.theme = dark ? 'dark' : 'light'
          if (dark) document.querySelector('meta[name="theme-color"]').setAttribute('content', '#12172b')
        } catch (error) {
          // Storage unavailable (private mode): ThemeProvider applies the default theme on mount.
        }
      })()
    </script>
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; connect-src 'self' https://api.gustapp.ca http://localhost:* http://127.0.0.1:* http://[::1]:* ws://localhost:* ws://127.0.0.1:* ws://[::1]:*; img-src 'self' data: blob:; media-src 'self' blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; script-src 'self' 'unsafe-inline'; manifest-src 'self'; worker-src 'self' blob:"
    />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon-180.png" />
    <meta
      name="description"
      content="Gust is a voice-first task manager for fast mobile capture."
    />
    <title>Gust</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
  </html>
